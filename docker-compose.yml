# Local development database. Run `docker compose up -d`, then `yarn dev`.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: codescrobble
      POSTGRES_PASSWORD: codescrobble
      POSTGRES_DB: codescrobble
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "codescrobble"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
