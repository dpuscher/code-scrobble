services:
  app:
    container_name: app
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/codescrobble
      - REDISCLOUD_URL=redis://redis:6379
      - NODE_ENV=development
    restart: always
    build:
      context: .
      target: deps
    ports:
      - 3000:3000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "yarn install --immutable && yarn dev"]
  mongodb:
    container_name: mongodb
    image: mongo:7
    volumes:
      - ./data/mongodb:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    container_name: redis
    image: redis:7-alpine
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
